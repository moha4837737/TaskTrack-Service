<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskTrack</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:520px;margin:40px auto;padding:0 16px}
  form{display:flex;gap:8px}input{flex:1;padding:8px}button{padding:8px 12px;cursor:pointer}
  li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ddd}
  .done span{text-decoration:line-through;color:#888}ul{list-style:none;padding:0}
</style>
</head>
<body>
<h1>TaskTrack</h1>
<form id="f"><input id="t" placeholder="New task..." required><button>Add</button></form>
<ul id="list"></ul>
<script>
async function load(){
  const tasks = await (await fetch('/api/tasks')).json();
  const ul = document.getElementById('list'); ul.innerHTML='';
  tasks.forEach(t=>{
    const li=document.createElement('li'); if(t.done) li.className='done';
    const s=document.createElement('span'); s.textContent=t.title;
    s.style.cursor='pointer';
    s.onclick=async()=>{await fetch('/api/tasks/'+t.id,{method:'PUT'});load();};
    const b=document.createElement('button'); b.textContent='Delete';
    b.onclick=async()=>{await fetch('/api/tasks/'+t.id,{method:'DELETE'});load();};
    li.append(s,b); ul.append(li);
  });
}
document.getElementById('f').onsubmit=async e=>{
  e.preventDefault(); const i=document.getElementById('t');
  await fetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:i.value})});
  i.value=''; load();
};
load();
</script>
</body>
</html>
