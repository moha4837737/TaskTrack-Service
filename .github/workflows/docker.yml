name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: |
          pip install -r requirements.txt pytest
          pytest -q
      - name: Build Docker image
        run: docker build -t tasktrack-api .
      - name: Smoke test the container
        run: |
          docker run -d --name app -p 5000:5000 tasktrack-api
          sleep 5
          curl --fail http://localhost:5000/health
